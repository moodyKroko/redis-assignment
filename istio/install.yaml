apiVersion: install.istio.io/v1alpha1
kind: IstioOperator

metadata:
  name: redis-lab-istio
  namespace: istio-system

spec:
  profile: demo

  meshConfig:
    accessLogFile: /dev/stdout

    defaultConfig:
      holdApplicationUntilProxyStarts: true

  components:
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true

        k8s:
          service:
            type: NodePort

            ports:
              - name: status-port
                port: 15021
                targetPort: 15021
                nodePort: 30021
                protocol: TCP

              - name: http2
                port: 80
                targetPort: 8080
                nodePort: 30080
                protocol: TCP

              - name: https
                port: 443
                targetPort: 8443
                nodePort: 30443
                protocol: TCP

    egressGateways:
      - name: istio-egressgateway
        enabled: false
