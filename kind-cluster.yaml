apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster

# kubernetes cluster name
name: redis-lab

nodes:
  - role: control-plane

    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP

        # FastAPI NodePort access for Stage4
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP

    labels:
          ingress-ready: "true"

    extraMounts: []
