apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: redis-lab
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/moodyKroko/redis-assignment.git
    targetRevision: main
    path: helm/redis-lab

    helm:
      releaseName: redis-lab

      valueFiles:
        - values-local.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    retry:
      limit: 5

      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
