apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: {{ .Release.Namespace | quote }}

  labels:
    {{- include "redis-app.labels" . | nindent 4 }}

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}

    spec:
      containers:
        - name: redis
          image: {{ printf "%s:%s" .Values.redis.image.repository .Values.redis.image.tag | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}

          command:
            - /bin/sh
            - -c

          args:
            - |
              exec /usr/local/bin/docker-entrypoint.sh redis-server \
                --port {{ .Values.redis.port }} \
                --dir /data \
                --appendonly yes \
                --appendfsync everysec \
                --requirepass "$REDIS_PASSWORD"

          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

          volumeMounts:
            - name: redis-data
              mountPath: /data

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
