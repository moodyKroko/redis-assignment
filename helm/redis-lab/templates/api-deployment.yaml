apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-api
  namespace: {{ .Release.Namespace | quote }}

  labels:
    {{- include "redis-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.api.replicas }}

  selector:
    matchLabels:
      app: python-api

  template:
    metadata:
      labels:
        app: python-api

      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}

    spec:
      containers:
        - name: python-api
          image: {{ printf "%s:%s" .Values.api.image.repository .Values.api.image.tag | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}

          envFrom:
            - configMapRef:
                name: redis-cm

            - secretRef:
                name: redis-secret
