apiVersion: v1
kind: Service

metadata:
  name: python-api
  namespace: {{ .Release.Namespace | quote }}

  labels:
    {{- include "redis-app.labels" . | nindent 4 }}

spec:
  type: ClusterIP

  selector:
    app: python-api

  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.containerPort }}
      protocol: TCP
