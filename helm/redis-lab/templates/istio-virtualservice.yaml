{{- if .Values.mesh.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService

metadata:
  name: fastapi-route
  namespace: {{ .Release.Namespace | quote }}

spec:
  hosts:
    - "*"

  gateways:
    - fastapi-gateway

  http:
    - name: fastapi-api-prefix

      match:
        - uri:
            exact: /api

        - uri:
            prefix: /api/

      rewrite:
        uri: /

      route:
        - destination:
            host: python-api
            port:
              number: {{ .Values.api.service.port }}
{{- end }}
