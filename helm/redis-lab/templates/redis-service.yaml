apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: {{ .Release.Namespace | quote }}

  labels:
    {{- include "redis-app.labels" . | nindent 4 }}

spec:
  type: ClusterIP

  selector:
    app: redis

  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
      protocol: TCP
